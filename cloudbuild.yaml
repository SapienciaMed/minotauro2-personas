steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - '--cache-from'
      - 'us-central1-docker.pkg.dev/$_PROJECT_ID_DEVOPS/$_REPOSITORY_NAME/$_IMAGE_NAME:latest'
      - '-t'
      - 'us-central1-docker.pkg.dev/$_PROJECT_ID_DEVOPS/$_REPOSITORY_NAME/$_IMAGE_NAME'
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - >-
        us-central1-docker.pkg.dev/$_PROJECT_ID_DEVOPS/$_REPOSITORY_NAME/$_IMAGE_NAME
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - '--image'
      - >-
        us-central1-docker.pkg.dev/$_PROJECT_ID_DEVOPS/$_REPOSITORY_NAME/$_IMAGE_NAME
      - '--region'
      - us-central1
      - '--port'
      - $_PORT
      - '--project'
      - $_PROJECT_ID
    entrypoint: gcloud
options:
  logging: CLOUD_LOGGING_ONLY
